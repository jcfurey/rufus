name: Native Linux

on:
  push:
    branches: [linux-port]
    paths: ['linux/**', 'rufus-linux', 'res/freedos/**', 'res/uefi/**', 'src/ms-sys/inc/**', '.github/workflows/linux.yml']
  pull_request:
    paths: ['linux/**', 'rufus-linux', 'res/freedos/**', 'res/uefi/**', 'src/ms-sys/inc/**', '.github/workflows/linux.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: amd64
          - runner: ubuntu-24.04-arm
            platform: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 udisks2 dosfstools udftools exfatprogs xorriso xvfb xauth wimtools qemu-utils zstd mtools ntfs-3g 7zip qemu-system-x86 seabios ovmf e2fsprogs fdisk
      - name: Install x86 bootloaders and kernel-test dependencies
        if: matrix.platform == 'amd64'
        run: sudo apt-get install -y grub-common grub-pc-bin grub-efi-amd64-bin syslinux busybox-static linux-image-generic
      - name: Install native ARM GRUB and boot-test dependencies
        if: matrix.platform == 'arm64'
        run: sudo apt-get install -y grub-common grub-efi-arm64-bin qemu-system-arm qemu-efi-aarch64 busybox-static linux-image-generic
      - name: Test image writing and drive protection
        run: make -C linux check
      - name: Build standalone application and Ubuntu package
        run: make -C linux all deb
      - name: Boot generated BIOS and UEFI media without root
        if: matrix.platform == 'amd64'
        run: make -C linux boot-test uefi-test
      - name: Restore VHDX containers and boot through BIOS and UEFI
        if: matrix.platform == 'amd64'
        run: make -C linux vhdx-test
      - name: Boot a real Linux kernel through Syslinux BIOS and GRUB UEFI USB media
        if: matrix.platform == 'amd64'
        run: |
          SYSLINUX_TEST_KERNEL=$(find /boot -maxdepth 1 -name 'vmlinuz-*' -type f | sort -V | tail -n 1)
          sudo install -m644 "$SYSLINUX_TEST_KERNEL" linux/build/syslinux-test-kernel
          make -C linux syslinux-test SYSLINUX_KERNEL=build/syslinux-test-kernel
          FS_TEST_RELEASE=$(basename "$SYSLINUX_TEST_KERNEL" | sed 's/^vmlinuz-//')
          make -C linux filesystem-test FS_KERNEL=build/syslinux-test-kernel FS_MODULES="/lib/modules/$FS_TEST_RELEASE"
      - name: Boot ARM64 UEFI media and a real Linux kernel without root
        if: matrix.platform == 'arm64'
        run: |
          ARM_TEST_KERNEL=$(find /boot -maxdepth 1 -name 'vmlinuz-*' -type f | sort -V | tail -n 1)
          sudo install -m644 "$ARM_TEST_KERNEL" linux/build/arm-test-kernel
          python3 linux/tests/arm_smoke.py --architecture arm64 \
            --kernel linux/build/arm-test-kernel --busybox /usr/bin/busybox \
            --firmware-code /usr/share/AAVMF/AAVMF_CODE.fd \
            --firmware-vars /usr/share/AAVMF/AAVMF_VARS.fd \
            --output-dir linux/build/arm64-boot-test
          python3 linux/tests/vhdx_smoke.py --skip-x86 \
            --arm64-image linux/build/arm64-boot-test/arm-live.img \
            --output-dir linux/build/arm64-vhdx-boot-test
          ARM_TEST_RELEASE=$(basename "$ARM_TEST_KERNEL" | sed 's/^vmlinuz-//')
          python3 linux/tests/filesystem_smoke.py --kernel linux/build/arm-test-kernel \
            --modules "/lib/modules/$ARM_TEST_RELEASE" --busybox /usr/bin/busybox \
            --firmware-code /usr/share/AAVMF/AAVMF_CODE.fd \
            --firmware-vars /usr/share/AAVMF/AAVMF_VARS.fd \
            --output-dir linux/build/arm64-filesystem-test
      - name: Check desktop startup
        run: |
          xvfb-run -a ./linux/dist/rufus-linux gui --smoke-test
          xvfb-run -a make -C linux gui-test
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
      - uses: actions/upload-artifact@v7
        with:
          name: rufus-linux-${{ matrix.platform }}
          path: |
            linux/dist/rufus-linux
            linux/dist/*.deb
